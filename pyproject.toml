[project]
name = "personalens"
version = "0.1.0"
description = "Persona-based UI/product review — a code review, but for UX. Drives Playwright, screenshots, and a vision LLM to score a URL from each persona's point of view."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Berk Gökden", email = "berk@primaxiom.ai" }]
keywords = ["ux", "ui-review", "personas", "playwright", "vision-llm", "agents", "ci", "screenshot", "product-review"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []  # zero runtime deps for the core; Ollama vision via stdlib HTTP

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/bgokden/personalens"
Author = "https://berkgokden.com"

[project.scripts]
personalens = "personalens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personalens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: real browser + vision-model tests, skipped unless configured"]
