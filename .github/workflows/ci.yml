name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Offline core tests (personas parsing, review aggregation, report, scoring)
      # via FakeVisionBackend + a hand-built Capture. No browser, no vision model.
      - name: Install
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: pytest -q
        env:
          PYTHONPATH: src
